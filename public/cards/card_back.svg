<svg xmlns="http://www.w3.org/2000/svg" width="167.0869141pt" height="242.6669922pt" viewBox="0 0 167.0869141 242.6669922">
  <defs>
    <!-- Ornate Card Back Pattern matching Durak Template -->
    <pattern id="card-back-pattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#B8333A"/>
      <path d="M8 0L16 8L8 16L0 8Z" fill="none" stroke="#F3C6C8" stroke-width="0.85"/>
      <circle cx="8" cy="8" r="2.8" fill="none" stroke="#F3C6C8" stroke-width="0.75"/>
      <circle cx="8" cy="8" r="1.1" fill="#F3C6C8"/>
      <circle cx="0" cy="0" r="1.4" fill="#E29598"/>
      <circle cx="16" cy="0" r="1.4" fill="#E29598"/>
      <circle cx="0" cy="16" r="1.4" fill="#E29598"/>
      <circle cx="16" cy="16" r="1.4" fill="#E29598"/>
    </pattern>

    <radialGradient id="back-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D9454E" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8E1C22" stop-opacity="0.95"/>
    </radialGradient>
  </defs>

  <!-- Card Base (White Card Stock) -->
  <rect x="0.5" y="0.5" width="166.0869" height="241.667" rx="8.5" ry="8.5" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="0.8"/>

  <!-- Outer Color Margin -->
  <rect x="6" y="6" width="155.0869" height="230.667" rx="6" ry="6" fill="#B8333A" stroke="#7F1D1D" stroke-width="1.2"/>

  <!-- Ornate Pattern Field -->
  <rect x="9.5" y="9.5" width="148.0869" height="223.667" rx="4.5" ry="4.5" fill="url(#card-back-pattern)"/>

  <!-- Vignette Depth Overlay -->
  <rect x="9.5" y="9.5" width="148.0869" height="223.667" rx="4.5" ry="4.5" fill="url(#back-glow)" style="mix-blend-mode: multiply;"/>

  <!-- Gold/Rose Double Frame Border -->
  <rect x="12" y="12" width="143.0869" height="218.667" rx="3.5" ry="3.5" fill="none" stroke="#FDE68A" stroke-width="1.2" stroke-opacity="0.9"/>
  <rect x="14.5" y="14.5" width="138.0869" height="213.667" rx="2.5" ry="2.5" fill="none" stroke="#F5A623" stroke-width="0.75" stroke-opacity="0.8"/>

  <!-- Corner Flourish Accents -->
  <g stroke="#FDE68A" stroke-width="1" fill="none" stroke-linecap="round">
    <path d="M17 23 L23 17 M17 17 L25 17 M17 17 L17 25"/>
    <path d="M150 23 L144 17 M150 17 L142 17 M150 17 L150 25"/>
    <path d="M17 219 L23 225 M17 225 L25 225 M17 225 L17 217"/>
    <path d="M150 219 L144 225 M150 225 L142 225 M150 225 L150 217"/>
  </g>

  <!-- Central Regal Medallion -->
  <g transform="translate(83.543, 121.333)">
    <circle cx="0" cy="0" r="28" fill="#8E1C22" stroke="#FDE68A" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="24.5" fill="#B8333A" stroke="#F5A623" stroke-width="0.8" stroke-dasharray="3 1.5"/>
    
    <!-- Central Diamond Rosette -->
    <path d="M0 -18 L14 0 L0 18 L-14 0 Z" fill="none" stroke="#FDE68A" stroke-width="1.2"/>
    <path d="M-10 -10 L10 -10 L10 10 L-10 10 Z" fill="none" stroke="#FDE68A" stroke-width="0.8" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="6" fill="#FDE68A"/>
    <circle cx="0" cy="0" r="3.2" fill="#8E1C22"/>
    <circle cx="0" cy="0" r="1.2" fill="#FFFFFF"/>

    <!-- Axis Points -->
    <circle cx="0" cy="-21" r="1.8" fill="#FDE68A"/>
    <circle cx="0" cy="21" r="1.8" fill="#FDE68A"/>
    <circle cx="-21" cy="0" r="1.8" fill="#FDE68A"/>
    <circle cx="21" cy="0" r="1.8" fill="#FDE68A"/>
  </g>
</svg>
